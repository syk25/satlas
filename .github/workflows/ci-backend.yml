name: CI (backend)

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: satlas
          POSTGRES_PASSWORD: satlas
          POSTGRES_DB: satlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://satlas:satlas@localhost:5432/satlas_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: uv pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check app/ tests/

      - name: Format check (ruff)
        working-directory: backend
        run: uv run ruff format --check app/ tests/

      - name: Test (pytest)
        working-directory: backend
        run: uv run pytest
