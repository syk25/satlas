name: TLE Refresh

on:
  schedule:
    - cron: "0 0,12 * * *"  # 00:00 and 12:00 UTC daily
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ingest TLE feeds
        env:
          API_URL: ${{ secrets.SATLAS_API_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          python3 << 'EOF'
          import json, os, sys, time, urllib.request

          API_URL = os.environ["API_URL"].rstrip("/")
          ADMIN_TOKEN = os.environ["ADMIN_TOKEN"]

          GROUPS = [
              "stations", "weather", "goes", "military", "amateur",
              "gps-ops", "glo-ops", "galileo", "beidou", "oneweb",
              "iridium-NEXT", "resource", "planet", "science", "active",
          ]

          total, failed = 0, []

          for group in GROUPS:
              print(f"── {group}")

              # 1. Fetch from CelesTrak (GHA runner IPs are not blocked)
              try:
                  req = urllib.request.Request(
                      f"https://celestrak.org/NORAD/elements/gp.php?GROUP={group}&FORMAT=tle",
                      headers={"User-Agent": "satlas/0.1 (https://github.com/syk25/satlas)"},
                  )
                  with urllib.request.urlopen(req, timeout=120) as r:
                      tle_bytes = r.read()
              except Exception as exc:
                  print(f"   skip: fetch error — {exc}")
                  failed.append(group)
                  continue

              if not tle_bytes.strip() or b"not found" in tle_bytes.lower():
                  print(f"   skip: empty or invalid response")
                  failed.append(group)
                  continue

              print(f"   fetched {len(tle_bytes):,} bytes")

              # 2. Push to Satlas API
              try:
                  req2 = urllib.request.Request(
                      f"{API_URL}/admin/tle/ingest/{group}",
                      data=tle_bytes,
                      method="POST",
                      headers={
                          "Authorization": f"Bearer {ADMIN_TOKEN}",
                          "Content-Type": "text/plain; charset=utf-8",
                      },
                  )
                  with urllib.request.urlopen(req2, timeout=60) as r:
                      body = json.loads(r.read())
                  count = body["satellites"]
                  print(f"   committed {count:,} satellites")
                  total += count
              except Exception as exc:
                  print(f"   ERROR pushing to API — {exc}")
                  failed.append(group)

              time.sleep(3)

          print(f"\n{'═' * 40}")
          print(f"Total satellites committed: {total:,}")

          if failed:
              print(f"Failed feeds: {', '.join(failed)}")
              sys.exit(1)
          EOF
