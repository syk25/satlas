name: TLE Refresh

on:
  schedule:
    - cron: "0 0,12 * * *"  # 00:00 and 12:00 UTC daily
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ingest TLE feeds
        env:
          API_URL: ${{ secrets.SATLAS_API_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          # Group name → must match CATEGORY_FEEDS keys in tle_ingest.py
          GROUPS=(
            stations
            weather
            goes
            military
            amateur
            gps-ops
            glo-ops
            galileo
            beidou
            oneweb
            iridium-NEXT
            resource
            planet
            science
            active
          )

          TOTAL=0
          FAILED=()

          for GROUP in "${GROUPS[@]}"; do
            echo "── $GROUP"

            TLE=$(curl -sf \
              --max-time 120 \
              -H "User-Agent: satlas/0.1 (https://github.com/syk25/satlas)" \
              "https://celestrak.org/NORAD/elements/gp.php?GROUP=${GROUP}&FORMAT=tle" \
              || true)

            if [ -z "$TLE" ] || echo "$TLE" | grep -q "not found"; then
              echo "   skip: empty or invalid response"
              FAILED+=("$GROUP")
              continue
            fi

            LINES=$(echo "$TLE" | wc -l)
            echo "   fetched ${LINES} lines"

            RESPONSE=$(echo "$TLE" | curl -s \
              --max-time 60 \
              -o /tmp/resp.json \
              -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer $ADMIN_TOKEN" \
              -H "Content-Type: text/plain; charset=utf-8" \
              --data-binary @- \
              "${API_URL}/admin/tle/ingest/${GROUP}")

            if [ "$RESPONSE" = "200" ]; then
              COUNT=$(cat /tmp/resp.json | python3 -c "import sys,json; print(json.load(sys.stdin)['satellites'])")
              echo "   committed ${COUNT} satellites"
              TOTAL=$((TOTAL + COUNT))
            else
              echo "   ERROR HTTP ${RESPONSE}: $(cat /tmp/resp.json)"
              FAILED+=("$GROUP")
            fi

            sleep 3
          done

          echo ""
          echo "════════════════════════════════"
          echo "Total satellites committed: ${TOTAL}"

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "Failed feeds: ${FAILED[*]}"
            exit 1
          fi
