name: TLE Refresh

on:
  schedule:
    - cron: "0 0,12 * * *"  # 00:00 and 12:00 UTC daily
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ingest TLE feeds
        env:
          API_URL: ${{ secrets.SATLAS_API_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          python3 << 'EOF'
          import json, os, sys, time, urllib.request

          API_URL = os.environ["API_URL"].rstrip("/")
          ADMIN_TOKEN = os.environ["ADMIN_TOKEN"]
          UA = "satlas/0.1 (https://github.com/syk25/satlas)"

          GROUPS = [
              "stations", "weather", "goes", "military", "amateur",
              "gps-ops", "glo-ops", "galileo", "beidou", "oneweb",
              "iridium-NEXT", "resource", "planet", "science", "active",
          ]

          # ── SATCAT first: enriches every TLE feed with country/launch/type/RCS ──
          print("── satcat")
          try:
              req = urllib.request.Request(
                  "https://celestrak.org/pub/satcat.csv",
                  headers={"User-Agent": UA},
              )
              with urllib.request.urlopen(req, timeout=120) as r:
                  satcat_bytes = r.read()
              print(f"   fetched {len(satcat_bytes):,} bytes")
              req2 = urllib.request.Request(
                  f"{API_URL}/admin/satcat/ingest",
                  data=satcat_bytes,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {ADMIN_TOKEN}",
                      "Content-Type": "text/csv; charset=utf-8",
                  },
              )
              with urllib.request.urlopen(req2, timeout=60) as r:
                  resp = json.loads(r.read())
              print(f"   loaded {resp['entries']:,} satcat entries")
          except Exception as exc:
              print(f"   ERROR loading SATCAT — {exc}")
              print("   continuing with TLE feeds; metadata will be NULL")

          total, failed = 0, []

          for group in GROUPS:
              print(f"── {group}")

              # 1. Fetch from CelesTrak (GHA runner IPs are not blocked).
              # JSON gives us OMM mean elements; the backend synthesizes TLE
              # lines and merges in SATCAT metadata.
              try:
                  req = urllib.request.Request(
                      f"https://celestrak.org/NORAD/elements/gp.php?GROUP={group}&FORMAT=json",
                      headers={"User-Agent": UA},
                  )
                  with urllib.request.urlopen(req, timeout=120) as r:
                      payload = r.read()
              except Exception as exc:
                  print(f"   skip: fetch error — {exc}")
                  failed.append(group)
                  continue

              stripped = payload.strip()
              if not stripped or stripped == b"[]" or b"not found" in stripped.lower():
                  print(f"   skip: empty or invalid response")
                  failed.append(group)
                  continue

              print(f"   fetched {len(payload):,} bytes")

              # 2. Push to Satlas API
              try:
                  req2 = urllib.request.Request(
                      f"{API_URL}/admin/tle/ingest/{group}",
                      data=payload,
                      method="POST",
                      headers={
                          "Authorization": f"Bearer {ADMIN_TOKEN}",
                          "Content-Type": "application/json; charset=utf-8",
                      },
                  )
                  with urllib.request.urlopen(req2, timeout=60) as r:
                      resp = json.loads(r.read())
                  count = resp["satellites"]
                  print(f"   committed {count:,} satellites")
                  total += count
              except Exception as exc:
                  print(f"   ERROR pushing to API — {exc}")
                  failed.append(group)

              time.sleep(3)

          print(f"\n{'═' * 40}")
          print(f"Total satellites committed: {total:,}")

          # ── 24h visit-frequency precompute (ADR-019) ──
          # Triggered after all feeds so the sweep uses the freshest catalog.
          # Runs ~5 minutes; the API endpoint blocks until the in-thread sweep
          # completes, then writes per-country hashes to Redis.
          print("── visits/recompute")
          try:
              req3 = urllib.request.Request(
                  f"{API_URL}/admin/visits/recompute",
                  data=b"",
                  method="POST",
                  headers={"Authorization": f"Bearer {ADMIN_TOKEN}"},
              )
              with urllib.request.urlopen(req3, timeout=900) as r:
                  resp = json.loads(r.read())
              print(
                  f"   {resp['satellites']:,} sats, "
                  f"{resp['countries']} countries, "
                  f"{resp['pairs']:,} pairs, "
                  f"{resp['elapsed_seconds']}s"
              )
          except Exception as exc:
              print(f"   ERROR recomputing visits — {exc}")
              # Non-fatal: TLE ingest already succeeded; visits can be retried
              # next cycle. Frontend gracefully handles missing pass counts.

          if failed:
              print(f"Failed feeds: {', '.join(failed)}")
              sys.exit(1)
          EOF
