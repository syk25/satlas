<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="65%" cy="35%" r="90%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
    <radialGradient id="atm" cx="50%" cy="50%" r="55%">
      <stop offset="60%" stop-color="#7e14ff" stop-opacity="0"/>
      <stop offset="92%" stop-color="#863bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#863bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7e14ff" stop-opacity="0"/>
      <stop offset="60%" stop-color="#863bff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#47bfff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ede6ff"/>
      <stop offset="65%" stop-color="#a87cff"/>
      <stop offset="100%" stop-color="#7e14ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- starfield -->
  <g fill="#e6edf3">
    <circle cx="120" cy="80" r="1.5" opacity="0.8"/>
    <circle cx="200" cy="150" r="1" opacity="0.6"/>
    <circle cx="350" cy="60" r="1.2" opacity="0.7"/>
    <circle cx="430" cy="120" r="1" opacity="0.5"/>
    <circle cx="540" cy="220" r="1" opacity="0.6"/>
    <circle cx="650" cy="40" r="1.8" opacity="0.9"/>
    <circle cx="780" cy="100" r="1" opacity="0.5"/>
    <circle cx="900" cy="170" r="1.3" opacity="0.7"/>
    <circle cx="1080" cy="50" r="1" opacity="0.6"/>
    <circle cx="1140" cy="200" r="1.5" opacity="0.85"/>
    <circle cx="80" cy="450" r="1" opacity="0.5"/>
    <circle cx="150" cy="520" r="1.2" opacity="0.65"/>
    <circle cx="60" cy="560" r="1" opacity="0.6"/>
    <circle cx="320" cy="540" r="1" opacity="0.5"/>
    <circle cx="260" cy="40" r="0.8" opacity="0.5"/>
    <circle cx="490" cy="380" r="0.8" opacity="0.45"/>
  </g>

  <!-- earth (lower-right, partially clipped) -->
  <g>
    <circle cx="1100" cy="760" r="430" fill="#0d1117" stroke="#7e14ff" stroke-width="2" opacity="0.95"/>
    <circle cx="1100" cy="760" r="430" fill="url(#atm)"/>
    <!-- latitude arcs -->
    <g stroke="#47bfff" stroke-width="1" fill="none" opacity="0.28">
      <ellipse cx="1100" cy="760" rx="430" ry="120"/>
      <ellipse cx="1100" cy="760" rx="430" ry="220"/>
      <ellipse cx="1100" cy="760" rx="430" ry="330"/>
    </g>
    <!-- longitude arcs -->
    <g stroke="#47bfff" stroke-width="1" fill="none" opacity="0.22">
      <path d="M 700 760 A 430 430 0 0 1 1530 760"/>
      <ellipse cx="1100" cy="760" rx="200" ry="430"/>
      <ellipse cx="1100" cy="760" rx="320" ry="430"/>
    </g>
  </g>

  <!-- orbit / ground track curve -->
  <path d="M 540 340 Q 760 160 1060 290"
        stroke="url(#trail)" stroke-width="3" fill="none"
        stroke-dasharray="6 6" stroke-linecap="round"/>

  <!-- satellite -->
  <g transform="translate(1060 290) rotate(-30)">
    <circle r="22" fill="none" stroke="#863bff" stroke-width="1.5" opacity="0.45"/>
    <rect x="-32" y="-7" width="22" height="14" fill="#47bfff" rx="1.5" opacity="0.95"/>
    <rect x="10" y="-7" width="22" height="14" fill="#47bfff" rx="1.5" opacity="0.95"/>
    <rect x="-13" y="-13" width="26" height="26" fill="#ede6ff" rx="3"/>
    <circle cx="0" cy="0" r="3" fill="#7e14ff"/>
  </g>

  <!-- title block -->
  <text x="80" y="305"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="132" font-weight="800" fill="url(#title)"
        letter-spacing="-0.02em">SATLAS</text>
  <text x="84" y="365"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="500" fill="#e6edf3" opacity="0.9">Satellites over each country</text>
  <text x="84" y="405"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="16" font-weight="500" fill="#8b949e" letter-spacing="0.18em">OPEN SOURCE · REAL-TIME</text>
</svg>
