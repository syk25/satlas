[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "satlas-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "redis[hiredis]>=5.0",
    "celery[redis]>=5.3",
    "sgp4>=2.23",
    "shapely>=2.0",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["alembic/versions/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
