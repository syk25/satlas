[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "satlas-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "redis[hiredis]>=5.0",
    "celery[redis]>=5.3",
    "sgp4>=2.23",
    "shapely>=2.0",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
