# Satlas backend — Fly.io configuration
app = "satlas-api"
primary_region = "sjc"  # San Jose — CelesTrak blocks NRT IPs for large feeds (active group)

[build]
  dockerfile = "backend/Dockerfile.prod"

[env]
  ENVIRONMENT = "production"
  PORT = "8080"

[deploy]
  release_command = "alembic upgrade head"

# ADR-021: three process groups, each on its own machine.
[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8080"
  worker = "celery -A app.celery_app worker --loglevel=info --concurrency=1"
  beat = "celery -A app.celery_app beat --loglevel=info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]   # only the API serves HTTP

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80

# API: needs CPU headroom for SGP4 + handles user requests.
[[vm]]
  processes = ["app"]
  size = "shared-cpu-2x"
  memory = "1024mb"

# Worker: runs the 15-min prewarm sweep. Stays on shared-cpu-1x:512mb with
# concurrency=1 — Fly's shared-CPU burst-credit model penalizes sustained
# parallel CPU work (concurrency=2 dropped each task to baseline = 10× per-task
# slowdown in practice). A single sweep finishes in ~13 min, comfortably
# inside the 20-min cache TTL.
[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "512mb"

# Beat: holds only the schedule + emits task dispatches. Tiny.
[[vm]]
  processes = ["beat"]
  size = "shared-cpu-1x"
  memory = "256mb"
